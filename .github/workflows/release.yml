name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v1.0.0）"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Windows 发布包
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Ensure VC++ runtime DLLs bundled
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','vccorlib140.dll')) {
            if (-not (Test-Path "$out/$dll")) {
              $src = "C:\Windows\System32\$dll"
              if (Test-Path $src) {
                Copy-Item $src $out
                Write-Host "Copied $dll into release bundle"
              } else {
                Write-Host "WARNING: $dll not found in System32"
              }
            }
          }
          # 关键运行库缺失则直接失败，避免产出无法运行的包
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll')) {
            if (-not (Test-Path "$out/$dll")) {
              Write-Error "Missing required runtime DLL: $dll"
              exit 1
            }
          }

      - name: Package Windows zip
        shell: pwsh
        run: |
          $pkg = "cloudtunnelx-windows-${{ env.RELEASE_TAG }}.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $pkg -Force
          "PKG_PATH=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudtunnelx-windows
          path: ${{ env.PKG_PATH }}
          retention-days: 7

  # Android 发布包
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 应用内升级要求各版本签名一致：
      # 从 Secrets 解码稳定 keystore 生成签名配置；未配置时回退 debug 签名
      # （但 CI 每次运行密钥都不同，跨版本应用内升级会报"签名不一致"，最好配置）。
      - name: Configure release signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Release signing configured from secrets"
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 not set; release will use per-run debug key (in-app upgrade will fail with signature mismatch)"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build Android release APK
        run: flutter build apk --release --no-pub

      - name: Build Android release App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk cloudtunnelx-android-${{ env.RELEASE_TAG }}.apk
          cp build/app/outputs/bundle/release/app-release.aab cloudtunnelx-android-${{ env.RELEASE_TAG }}.aab

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudtunnelx-android
          path: |
            cloudtunnelx-android-${{ env.RELEASE_TAG }}.apk
            cloudtunnelx-android-${{ env.RELEASE_TAG }}.aab
          retention-days: 7

  # 合并并发布到 GitHub Release
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudtunnelx-windows

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudtunnelx-android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            cloudtunnelx-windows-${{ env.RELEASE_TAG }}.zip
            cloudtunnelx-android-${{ env.RELEASE_TAG }}.apk
            cloudtunnelx-android-${{ env.RELEASE_TAG }}.aab
